name: Osveži tabelu i rezultate (sreda + vikend)

on:
  schedule:
    # Sreda, subota i nedelja, svaka 2 sata od 10 do 24h po beogradskom vremenu
    # (cron je u UTC-u: 9–23 UTC zimi = 10–24h kod nas).
    - cron: "0 9-23/2 * * 3,6,0"
  workflow_dispatch: {} # ručno pokretanje iz kartice Actions

permissions:
  contents: write
  actions: write # za korak "drži aktivnim"

concurrency:
  group: osvezi-podatke
  cancel-in-progress: false

jobs:
  osvezi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/osvezi-podatke.mjs
      - name: Commit ako ima promena (Vercel onda sam objavi sajt)
        run: |
          if git diff --quiet -- data/; then
            echo "Nema promena."
            exit 0
          fi
          git config user.name "singi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Tabela i rezultati sa srbijasport.net"
          git push
      - name: Drži zakazano pokretanje aktivnim
        # GitHub gasi zakazane Action-e posle 60 dana bez aktivnosti u repou
        # (npr. leti, kad nema utakmica). Ovo ih ponovo potvrđuje pri svakom pokretanju.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/osvezi-podatke.yml/enable"
